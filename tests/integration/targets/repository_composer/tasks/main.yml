# Needs a running Nexus. Connection settings come from tests/integration/integration_config.yml.
- name: Test shaerpour.nexus.repository_composer
  module_defaults:
    shaerpour.nexus.repository_composer:
      url: "{{ nexus_url }}"
      username: "{{ nexus_username }}"
      password: "{{ nexus_password }}"
  block:
    - name: Create hosted repository in check mode
      shaerpour.nexus.repository_composer:
        name: test-composer-hosted
      check_mode: true
      register: check

    - name: Create hosted repository
      shaerpour.nexus.repository_composer:
        name: test-composer-hosted
      register: create

    - name: Create hosted repository again
      shaerpour.nexus.repository_composer:
        name: test-composer-hosted
      register: again

    - name: Update hosted repository
      shaerpour.nexus.repository_composer:
        name: test-composer-hosted
        online: false
      register: update

    - name: Create proxy repository
      shaerpour.nexus.repository_composer:
        name: test-composer-proxy
        type: proxy
        remote_url: https://repo.packagist.org
      register: proxy

    - name: Create proxy repository again
      shaerpour.nexus.repository_composer:
        name: test-composer-proxy
        type: proxy
        remote_url: https://repo.packagist.org
      register: proxy_again

    - name: Create group repository
      shaerpour.nexus.repository_composer:
        name: test-composer-group
        type: group
        members: [test-composer-hosted, test-composer-proxy]
      register: group

    - name: Create group repository again
      shaerpour.nexus.repository_composer:
        name: test-composer-group
        type: group
        members: [test-composer-hosted, test-composer-proxy]
      register: group_again

    - name: Proxy without remote_url fails
      shaerpour.nexus.repository_composer:
        name: test-composer-invalid
        type: proxy
      register: invalid
      ignore_errors: true

    - name: Check results
      ansible.builtin.assert:
        that:
          - check is changed
          - create is changed
          - again is not changed
          - update is changed
          - proxy is changed
          - proxy_again is not changed
          - group is changed
          - group_again is not changed
          - invalid is failed

  always:
    - name: Delete repositories
      shaerpour.nexus.repository_composer:
        name: "{{ item.name }}"
        type: "{{ item.type }}"
        remote_url: https://repo.packagist.org
        members: [test-composer-hosted]
        state: absent
      loop:
        - {name: test-composer-group, type: group}
        - {name: test-composer-proxy, type: proxy}
        - {name: test-composer-hosted, type: hosted}
